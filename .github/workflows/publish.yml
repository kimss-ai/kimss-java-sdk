name: Publish to Maven Central

# Requires Central portal credentials + GPG on the public mirror repo.
# Enable profile -Ppublish after Sonatype namespace ai.kimss is approved.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Publish
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [ -z "${MAVEN_USERNAME:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
            echo "Skip publish: set CENTRAL_USERNAME / CENTRAL_PASSWORD (and GPG secrets) on the public mirror."
            exit 0
          fi
          mvn -B -Ppublish clean deploy
