name: Publish to Maven Central

# SSOT: kimssApi/kimss_java_sdk → mirrored to https://github.com/kimss-ai/kimss-java-sdk
# Secrets on public mirror: CENTRAL_USERNAME, CENTRAL_PASSWORD, MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Build signed Central bundle and upload
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${MAVEN_USERNAME:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
            echo "Skip publish: set CENTRAL_USERNAME / CENTRAL_PASSWORD (and GPG secrets) on the public mirror."
            exit 0
          fi

          # Sign artifacts (verify phase). Do not use central-publishing deploy — it can
          # leave maven-metadata under ai/kimss/kimss-java/ which Central rejects.
          mvn -B -Ppublish clean verify

          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          GROUP_PATH=ai/kimss/kimss-java
          STAGE_ROOT=target/central-staging
          STAGE="${STAGE_ROOT}/${GROUP_PATH}/${VERSION}"
          PUB=target/central-publishing
          mkdir -p "$STAGE" "$PUB"

          ART="kimss-java-${VERSION}"
          cp pom.xml "${STAGE}/${ART}.pom"
          cp "target/${ART}.jar" "$STAGE/"
          cp "target/${ART}-sources.jar" "$STAGE/"
          cp "target/${ART}-javadoc.jar" "$STAGE/"
          cp "target/${ART}.jar.asc" "$STAGE/"
          cp "target/${ART}.pom.asc" "$STAGE/"
          cp "target/${ART}-sources.jar.asc" "$STAGE/"
          cp "target/${ART}-javadoc.jar.asc" "$STAGE/"

          # Required checksums (md5 + sha1 minimum; sha256/512 accepted)
          while IFS= read -r -d '' f; do
            md5sum "$f" | awk '{print $1}' > "${f}.md5"
            sha1sum "$f" | awk '{print $1}' > "${f}.sha1"
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
            sha512sum "$f" | awk '{print $1}' > "${f}.sha512"
          done < <(find "$STAGE" -type f ! -name '*.md5' ! -name '*.sha1' ! -name '*.sha256' ! -name '*.sha512' -print0)

          echo "== Staging tree =="
          find "$STAGE_ROOT" -type f | sort

          python3 - <<'PY'
          import pathlib, zipfile
          stage = pathlib.Path("target/central-staging")
          out = pathlib.Path("target/central-publishing/central-bundle.zip")
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage).as_posix())
          names = zipfile.ZipFile(out).namelist()
          print("Wrote", out, "files", len(names))
          for n in names:
              print(n)
          if not any(n.endswith(".pom") and "/kimss-java-" in n.replace("\\", "/") for n in names):
              raise SystemExit("Bundle is missing kimss-java-*.pom")
          if any("maven-metadata" in n for n in names):
              raise SystemExit("Bundle contains maven-metadata")
          PY

          # Portal API: https://central.sonatype.org/publish/publish-portal-api/
          AUTH=$(printf '%s:%s' "$MAVEN_USERNAME" "$MAVEN_PASSWORD" | base64 -w0)
          NAME="kimss-java-${VERSION}"

          drop_deployment() {
            local id="$1"
            [ -z "$id" ] && return 0
            echo "Dropping Central deployment ${id} (best-effort)..."
            curl -sS -X DELETE -H "Authorization: Bearer ${AUTH}" \
              "https://central.sonatype.com/api/v1/publisher/deployment/${id}" || true
          }

          # Prior failed / stuck attempts that can block a new GAV publish
          for id in \
            923422ad-89de-4321-b2c0-4bd2eb28aecb \
            af82ae93-400d-4950-9be8-09d442516a26 \
            03f114bd-1039-4482-813a-f392b4ff7c57 \
            20b0328a-0d88-496a-bcdd-33d60fca3f8c
          do
            drop_deployment "$id"
          done
          sleep 3

          upload_and_wait() {
            echo "Uploading bundle as ${NAME} (AUTOMATIC)..."
            local HTTP_CODE RESP DEPLOYMENT_ID STATUS_JSON STATE OTHER
            HTTP_CODE=$(curl -sS -o /tmp/central-upload.txt -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${AUTH}" \
              -F "bundle=@${PUB}/central-bundle.zip" \
              "https://central.sonatype.com/api/v1/publisher/upload?name=${NAME}&publishingType=AUTOMATIC")
            RESP=$(cat /tmp/central-upload.txt)
            echo "HTTP ${HTTP_CODE} body: ${RESP}"
            if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Central upload failed"
              return 1
            fi
            DEPLOYMENT_ID=$(echo "$RESP" | tr -d '"[:space:]')
            if [ -z "$DEPLOYMENT_ID" ]; then
              echo "::error::No deploymentId from Central upload"
              return 1
            fi
            echo "Polling deployment ${DEPLOYMENT_ID}..."
            for i in $(seq 1 90); do
              STATUS_JSON=$(curl -sS -X POST \
                -H "Authorization: Bearer ${AUTH}" \
                "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")
              echo "$STATUS_JSON"
              STATE=$(echo "$STATUS_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('deploymentState',''))")
              case "$STATE" in
                PUBLISHED)
                  echo "Published ai.kimss:kimss-java:${VERSION}"
                  echo "https://repo1.maven.org/maven2/ai/kimss/kimss-java/${VERSION}/"
                  return 0
                  ;;
                FAILED)
                  OTHER=$(echo "$STATUS_JSON" | python3 -c "import sys,json,re; e=json.load(sys.stdin).get('errors',{}); t=str(e); m=re.search(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', t); print(m.group(0) if m else '')")
                  if [ -n "$OTHER" ] && [ "$OTHER" != "$DEPLOYMENT_ID" ]; then
                    drop_deployment "$OTHER"
                    drop_deployment "$DEPLOYMENT_ID"
                    return 2
                  fi
                  echo "::error::Central deployment FAILED"
                  return 1
                  ;;
              esac
              sleep 10
            done
            echo "::error::Timed out waiting for PUBLISHED"
            return 1
          }

          set +e
          upload_and_wait
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "Retrying upload after dropping conflicting deployment..."
            sleep 5
            upload_and_wait
            rc=$?
          fi
          exit "$rc"
